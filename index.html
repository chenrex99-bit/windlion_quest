<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>金門百尊風獅爺尋寶手札 🦁</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: 手繪/圓體風格字型 -->
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-paper: #FDF8EC;
      --ink-black: #3D312A;
      --lion-red: #E05A47;
      --lion-gold: #F2B705;
      --sage-green: #68A678;
    }

    body {
      font-family: 'Zen Maru Gothic', 'Yomogi', sans-serif;
      background-color: var(--bg-paper);
      color: var(--ink-black);
      background-image: radial-gradient(#D8C8B0 1.5px, transparent 1.5px);
      background-size: 22px 22px;
      overflow-x: hidden;
      user-select: none;
    }

    /* 手繪不規則邊框 */
    .sketch-box {
      border: 3px solid var(--ink-black);
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      box-shadow: 4px 4px 0px var(--ink-black);
      background-color: #FFFFFF;
      transition: all 0.15s ease;
    }

    .sketch-box-sm {
      border: 2.5px solid var(--ink-black);
      border-radius: 15px 225px 15px 255px / 255px 15px 225px 15px;
      box-shadow: 3px 3px 0px var(--ink-black);
    }

    .sketch-btn {
      border: 2.5px solid var(--ink-black);
      border-radius: 255px 25px 225px 25px / 25px 225px 25px 255px;
      box-shadow: 2.5px 2.5px 0px var(--ink-black);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      cursor: pointer;
    }

    .sketch-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0.5px 0.5px 0px var(--ink-black);
    }

    /* 手繪拉桿樣式 */
    input[type="range"].sketch-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 10px;
      background: #E6DEC8;
      border: 2px solid var(--ink-black);
      border-radius: 999px;
      outline: none;
    }
    input[type="range"].sketch-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--lion-red);
      border: 2.5px solid var(--ink-black);
      cursor: pointer;
      box-shadow: 1px 1px 0px var(--ink-black);
    }

    /* 印章動畫效果 */
    @keyframes stamp-slam {
      0% { transform: scale(2.5) rotate(-25deg); opacity: 0; }
      70% { transform: scale(0.9) rotate(-12deg); opacity: 1; }
      100% { transform: scale(1) rotate(-12deg); opacity: 0.92; }
    }

    .stamp-badge {
      border: 3px double #D63A2F;
      color: #D63A2F;
      padding: 2px 8px;
      font-weight: 900;
      letter-spacing: 1px;
      border-radius: 8px;
      transform: rotate(-12deg);
      animation: stamp-slam 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      background: rgba(255, 245, 245, 0.9);
      box-shadow: inset 0 0 0 1px #D63A2F;
    }

    /* 溫暖手繪風地圖濾鏡 */
    .leaflet-tile-pane {
      filter: sepia(25%) saturate(88%) hue-rotate(345deg) contrast(96%) brightness(102%);
    }

    .leaflet-container {
      font-family: 'Zen Maru Gothic', sans-serif;
      background: #EAE0C8;
    }

    .leaflet-popup-content-wrapper {
      border: 3px solid var(--ink-black);
      border-radius: 20px 8px 22px 8px / 8px 22px 8px 20px;
      box-shadow: 4px 4px 0px var(--ink-black);
      background: #FFFDF7;
      padding: 2px;
    }

    .leaflet-popup-tip {
      background: var(--ink-black);
    }

    .washi-tape {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 100px;
      height: 22px;
      background-color: rgba(242, 183, 5, 0.45);
      border-left: 2px dashed rgba(61, 49, 42, 0.25);
      border-right: 2px dashed rgba(61, 49, 42, 0.25);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-6">

  <!-- 頂部近距離通知橫幅 -->
  <div id="proximity-alert" class="fixed top-4 left-1/2 -translate-x-1/2 z-[2000] w-[94%] max-w-md hidden">
    <div class="sketch-box bg-[#FFF4CC] p-4 flex items-center gap-3 border-[#3D312A]">
      <div class="text-4xl animate-bounce">🦁</div>
      <div class="flex-1 min-w-0">
        <div class="text-xs font-bold text-[#E05A47] uppercase tracking-wider">✨ 雷達感應到野生風獅爺！</div>
        <h4 id="alert-title" class="font-black text-base text-[#3D312A] truncate">瓊林風獅爺 就在附近！</h4>
        <p id="alert-desc" class="text-xs text-stone-600">已進入你的設定感應範圍，快去蓋章吧！</p>
      </div>
      <button onclick="collectFromAlert()" class="sketch-btn bg-[#E05A47] text-white px-3 py-2 text-xs font-bold whitespace-nowrap">
        立即蓋章
      </button>
      <button onclick="closeAlert()" class="text-stone-400 hover:text-stone-700 font-bold text-lg px-1">✕</button>
    </div>
  </div>

  <!-- 頂部手繪標題與控制面板 -->
  <header class="max-w-7xl w-full mx-auto px-4 pt-4 pb-2">
    <div class="sketch-box bg-[#FFFBF0] p-4 relative">
      <div class="washi-tape"></div>
      
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <!-- 左側：標題與圖示 -->
        <div class="flex items-center gap-3">
          <div id="header-lion-icon" class="w-14 h-14 flex-shrink-0"></div>
          <div>
            <div class="flex items-center gap-1.5 mb-0.5">
              <span class="bg-[#E05A47] text-white text-[11px] font-bold px-2 py-0.5 rounded-full border border-[#3D312A]">
                全金門 100 尊完整版
              </span>
              <span class="text-xs font-bold text-stone-500">金門聚落尋寶手札</span>
            </div>
            <h1 class="text-2xl md:text-3xl font-black tracking-tight text-[#3D312A]">
              金門風獅爺大圖鑑
            </h1>
          </div>
        </div>

        <!-- 中間：自訂感應距離滑桿 -->
        <div class="sketch-box-sm bg-[#FDF8EC] px-3.5 py-2 flex flex-col justify-center min-w-[260px]">
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span class="text-stone-600">📡 雷達通知感應距離：</span>
            <span id="radius-display" class="text-[#E05A47] font-black text-sm">150 公尺 (m)</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[10px] font-bold text-stone-400">20m</span>
            <input id="radius-slider" type="range" min="20" max="2000" step="10" value="150"
                   oninput="updateAlertRadius(this.value)"
                   class="sketch-slider flex-1">
            <span class="text-[10px] font-bold text-stone-400">2km</span>
          </div>
          <!-- 快速切換距離按鈕 -->
          <div class="flex items-center gap-1 mt-1.5">
            <span class="text-[10px] text-stone-500 font-bold mr-1">快速設定:</span>
            <button onclick="updateAlertRadius(50)" class="text-[10px] font-bold px-1.5 py-0.5 rounded border border-[#3D312A] bg-white hover:bg-amber-100">50m</button>
            <button onclick="updateAlertRadius(150)" class="text-[10px] font-bold px-1.5 py-0.5 rounded border border-[#3D312A] bg-white hover:bg-amber-100">150m</button>
            <button onclick="updateAlertRadius(500)" class="text-[10px] font-bold px-1.5 py-0.5 rounded border border-[#3D312A] bg-white hover:bg-amber-100">500m</button>
            <button onclick="updateAlertRadius(1000)" class="text-[10px] font-bold px-1.5 py-0.5 rounded border border-[#3D312A] bg-white hover:bg-amber-100">1km</button>
          </div>
        </div>

        <!-- 右側：收集進度與 GPS 開關 -->
        <div class="flex flex-wrap items-center gap-2.5">
          <div class="sketch-box-sm bg-[#FDF8EC] px-3.5 py-2 flex items-center gap-3 flex-1 sm:flex-initial">
            <div>
              <div class="text-[11px] font-bold text-stone-500">百尊收集進度</div>
              <div class="text-base font-black text-[#3D312A]">
                <span id="collected-count" class="text-[#E05A47] text-xl">0</span> / <span id="total-count">100</span> 尊
              </div>
            </div>
            <div class="w-20 h-4 bg-stone-200 rounded-full border-2 border-[#3D312A] overflow-hidden p-0.5">
              <div id="progress-bar" class="h-full bg-[#68A678] rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>

          <button id="gps-btn" onclick="toggleGPS()" class="sketch-btn bg-[#FFE082] hover:bg-[#FFD54F] px-3.5 py-2.5 text-xs font-black flex items-center gap-1.5">
            <span id="gps-dot" class="w-2.5 h-2.5 rounded-full bg-stone-500 border border-[#3D312A]"></span>
            <span id="gps-text">開啟 GPS 雷達</span>
          </button>

          <button onclick="resetProgress()" title="重置收集紀錄" class="sketch-btn bg-stone-100 hover:bg-stone-200 px-2.5 py-2.5 text-xs font-bold text-stone-600">
            🔄
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 主內容區：左側地圖 + 右側百尊風獅爺手札 -->
  <main class="max-w-7xl w-full mx-auto px-4 mt-2 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5">
    
    <!-- 左欄：手繪尋寶地圖 (佔 7 欄) -->
    <section class="lg:col-span-7 flex flex-col">
      <div class="sketch-box p-3 bg-[#FFFDF9] flex-1 flex flex-col relative min-h-[400px] lg:min-h-[620px]">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-2 px-1">
          <div class="flex items-center gap-2">
            <span class="text-xs font-black bg-[#68A678] text-white px-2.5 py-1 rounded-md border-2 border-[#3D312A]">
              🗺️ 全島風獅爺分布圖
            </span>
            <span id="location-status" class="text-xs font-bold text-stone-500 truncate max-w-[240px] sm:max-w-none">
              📍 預設中心：金門大學周邊
            </span>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="centerOnUser()" class="sketch-btn bg-[#E3F2FD] px-2.5 py-1 text-xs font-bold text-blue-900">
              🧍 我的位置
            </button>
            <button onclick="resetMapCenter()" class="sketch-btn bg-[#FDF8EC] px-2.5 py-1 text-xs font-bold">
              🎯 金門全覽
            </button>
          </div>
        </div>

        <!-- Leaflet 地圖容器 -->
        <div id="map" class="w-full flex-1 rounded-xl border-2 border-[#3D312A] z-10 min-h-[350px]"></div>

        <!-- 地圖圖例 -->
        <div class="mt-2.5 flex flex-wrap items-center justify-between gap-2 text-xs text-stone-600 px-1">
          <div class="flex flex-wrap items-center gap-3 font-bold">
            <span class="flex items-center gap-1">
              <span class="inline-block w-3 h-3 rounded-full bg-[#E05A47] border border-[#3D312A]"></span> 已收集
            </span>
            <span class="flex items-center gap-1">
              <span class="inline-block w-3 h-3 rounded-full bg-[#9E9E9E] border border-[#3D312A]"></span> 未尋獲
            </span>
            <span class="flex items-center gap-1">
              <span class="inline-block w-3 h-3 rounded-full bg-[#3B82F6] border border-[#3D312A]"></span> 感應圈 (<span id="legend-radius">150m</span>)
            </span>
          </div>
          <span class="text-[11px] bg-amber-100 border border-amber-400 px-2 py-0.5 rounded font-bold text-amber-900">
            💡 點擊卡片「✨ 模擬走到附近」可直接瞬移測試通知！
          </span>
        </div>
      </div>
    </section>

    <!-- 右欄：百尊風獅爺圖鑑手札 (佔 5 欄) -->
    <section class="lg:col-span-5 flex flex-col">
      <div class="sketch-box p-4 bg-[#FFFDF9] flex-1 flex flex-col max-h-[660px]">
        
        <!-- 搜尋與鄉鎮篩選控制列 -->
        <div class="space-y-2.5 pb-3 mb-3 border-b-2 border-dashed border-stone-300">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-base font-black flex items-center gap-1">
              📖 百尊尋寶手札 <span id="filtered-count-badge" class="text-xs bg-amber-100 border border-[#3D312A] px-2 py-0.5 rounded-full">100 尊</span>
            </h2>
            <!-- 鄉鎮篩選下拉選單 -->
            <select id="township-select" onchange="setTownship(this.value)" class="sketch-btn bg-[#FDF8EC] px-2.5 py-1 text-xs font-black outline-none">
              <option value="all">📍 全部鄉鎮 (100)</option>
              <option value="金沙鎮">🦁 金沙鎮 (62)</option>
              <option value="金湖鎮">🦁 金湖鎮 (16)</option>
              <option value="金城鎮">🦁 金城鎮 (11)</option>
              <option value="金寧鄉">🦁 金寧鄉 (10)</option>
              <option value="烈嶼鄉">🐓 烈嶼鄉 (1)</option>
            </select>
          </div>

          <!-- 關鍵字搜尋框 -->
          <div class="relative">
            <input id="search-input" type="text" oninput="handleSearch(this.value)"
                   placeholder="🔍 搜尋村落或風獅爺名稱（如：瓊林、官澳、安岐...）"
                   class="w-full px-3 py-1.5 text-xs font-bold bg-[#FDF8EC] border-2 border-[#3D312A] rounded-lg outline-none focus:bg-white">
          </div>

          <!-- 收集狀態篩選按鈕 -->
          <div class="flex gap-1.5">
            <button onclick="setFilter('all')" id="filter-all" class="sketch-btn flex-1 py-1 text-xs font-black bg-[#E05A47] text-white">
              全部
            </button>
            <button onclick="setFilter('uncollected')" id="filter-uncollected" class="sketch-btn flex-1 py-1 text-xs font-bold bg-[#FDF8EC]">
              未尋獲
            </button>
            <button onclick="setFilter('collected')" id="filter-collected" class="sketch-btn flex-1 py-1 text-xs font-bold bg-[#FDF8EC]">
              已收集
            </button>
          </div>
        </div>

        <!-- 卡片滾動列表 -->
        <div id="lion-list" class="flex-1 overflow-y-auto pr-1 space-y-3">
          <!-- 由 JavaScript 動態渲染 -->
        </div>

      </div>
    </section>

  </main>

    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'stamp') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start();
          osc.stop(ctx.currentTime + 0.45);
        } else if (type === 'radar') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        }
      } catch (e) {}
    }

    // =========================================================
    // 5. 距離計算與自訂感應距離更新
    // =========================================================
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const toRad = deg => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function formatDistance(meters) {
      if (meters < 1000) return `${meters} m`;
      return `${(meters / 1000).toFixed(1)} km`;
    }

    function updateAlertRadius(val) {
      alertRadius = parseInt(val, 10);
      localStorage.setItem(RADIUS_KEY, String(alertRadius));

      // 同步拉桿與文字顯示
      document.getElementById('radius-slider').value = alertRadius;
      const label = alertRadius >= 1000 ? `${(alertRadius / 1000).toFixed(2)} 公里 (km)` : `${alertRadius} 公尺 (m)`;
      document.getElementById('radius-display').textContent = label;
      document.getElementById('legend-radius').textContent = formatDistance(alertRadius);

      // 即時調整地圖上的藍色感應圈半徑
      if (userCircle) {
        userCircle.setRadius(alertRadius);
      }
      if (userMarker) {
        userMarker.setPopupContent(`<div class="font-bold text-xs p-1">📍 你目前的位置<br><span class="text-blue-600">自訂感應半徑：${formatDistance(alertRadius)}</span></div>`);
      }

      // 範圍擴大時重新檢查是否有風獅爺進入感應圈
      checkProximityAndNotify();
      renderLionList();
    }

    // =========================================================
    // 6. 初始化地圖與標記
    // =========================================================
    function initMap() {
      map = L.map('map', { zoomControl: true }).setView([24.4580, 118.3750], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      updateUserMapMarker();
      renderMapMarkers();
    }

    function updateUserMapMarker() {
      if (!map) return;

      const userIcon = L.divIcon({
        className: 'custom-user-icon',
        html: `
          <div class="relative flex items-center justify-center w-9 h-9">
            <div class="absolute w-9 h-9 bg-blue-400 rounded-full animate-ping opacity-40"></div>
            <div class="w-7 h-7 rounded-full bg-[#3B82F6] border-2 border-[#3D312A] shadow flex items-center justify-center text-white text-xs font-black">
              我
            </div>
          </div>
        `,
        iconSize: [36, 36],
        iconAnchor: [18, 18]
      });

      if (userMarker) {
        userMarker.setLatLng([userPos.lat, userPos.lng]);
        userCircle.setLatLng([userPos.lat, userPos.lng]);
        userCircle.setRadius(alertRadius);
      } else {
        userCircle = L.circle([userPos.lat, userPos.lng], {
          radius: alertRadius,
          color: '#3B82F6',
          weight: 2,
          dashArray: '6, 6',
          fillColor: '#60A5FA',
          fillOpacity: 0.16
        }).addTo(map);

        userMarker = L.marker([userPos.lat, userPos.lng], { icon: userIcon, zIndexOffset: 1000 })
          .addTo(map)
          .bindPopup(`<div class="font-bold text-xs p-1">📍 你目前的位置<br><span class="text-blue-600">自訂感應半徑：${formatDistance(alertRadius)}</span></div>`);
      }
    }

    function renderMapMarkers() {
      WIND_LIONS.forEach(lion => {
        const isCollected = collectedIds.includes(lion.id);
        const dist = getDistanceMeters(userPos.lat, userPos.lng, lion.lat, lion.lng);

        // 鄉鎮篩選時，隱藏不屬於該鄉鎮的標記以保持畫面清爽
        const visible = (currentTownship === 'all' || lion.township === currentTownship);

        const customIcon = L.divIcon({
          className: 'lion-map-marker',
          html: `
            <div class="relative group cursor-pointer transition-transform hover:scale-125" style="width:38px;height:38px;">
              <div class="w-9 h-9 rounded-full border-2 border-[#3D312A] shadow flex items-center justify-center ${isCollected ? 'bg-[#FFF3E0]' : 'bg-stone-200'}">
                ${generateLionSVG(lion, isCollected, 32)}
              </div>
              ${isCollected ? `<span class="absolute -top-1 -right-1 bg-[#E05A47] text-white text-[9px] font-black w-4 h-4 rounded-full border border-[#3D312A] flex items-center justify-center">✓</span>` : ''}
            </div>
          `,
          iconSize: [38, 38],
          iconAnchor: [19, 19],
          popupAnchor: [0, -18]
        });

        const popupHtml = `
          <div class="p-2 min-w-[210px]">
            <div class="flex items-center justify-between gap-2 mb-1">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-100 border border-[#3D312A]">#${lion.indexNum} ${lion.township}</span>
              <span class="text-xs font-bold text-stone-500">距離 ${formatDistance(dist)}</span>
            </div>
            <h3 class="font-black text-base text-[#3D312A]">${lion.name}</h3>
            <p class="text-[11px] font-bold text-stone-500 mt-0.5">${lion.height}</p>
            <p class="text-xs text-stone-600 mt-1 leading-relaxed">${lion.feature}</p>
            <div class="mt-3 flex gap-1.5">
              <button onclick="toggleCollect('${lion.id}')" class="sketch-btn flex-1 py-1.5 text-xs font-black ${isCollected ? 'bg-stone-200 text-stone-700' : 'bg-[#E05A47] text-white'}">
                ${isCollected ? '✓ 已蓋章 (取消)' : '💮 蓋章收集'}
              </button>
              <a href="https://www.google.com/maps/dir/?api=1&destination=${lion.lat},${lion.lng}&travelmode=driving" target="_blank"
                 class="sketch-btn bg-[#68A678] text-white px-2.5 py-1.5 text-xs font-black flex items-center justify-center">
                🧭 導航
              </a>
            </div>
          </div>
        `;

        if (markers[lion.id]) {
          markers[lion.id].setIcon(customIcon);
          markers[lion.id].setPopupContent(popupHtml);
          if (visible && !map.hasLayer(markers[lion.id])) {
            markers[lion.id].addTo(map);
          } else if (!visible && map.hasLayer(markers[lion.id])) {
            map.removeLayer(markers[lion.id]);
          }
        } else {
          markers[lion.id] = L.marker([lion.lat, lion.lng], { icon: customIcon })
            .bindPopup(popupHtml);
          if (visible) markers[lion.id].addTo(map);
        }
      });
    }

    function resetMapCenter() {
      map.flyTo([24.4580, 118.3750], 12, { duration: 0.7 });
    }

    function centerOnUser() {
      map.flyTo([userPos.lat, userPos.lng], 15, { duration: 0.7 });
      if (userMarker) userMarker.openPopup();
    }

    function focusLionOnMap(lionId) {
      const lion = WIND_LIONS.find(l => l.id === lionId);
      if (!lion) return;
      map.flyTo([lion.lat, lion.lng], 16, { duration: 0.7 });
      setTimeout(() => {
        if (markers[lion.id]) markers[lion.id].openPopup();
      }, 500);
    }

    // =========================================================
    // 7. 渲染右側百尊風獅爺圖鑑手札
    // =========================================================
    function renderLionList() {
      const container = document.getElementById('lion-list');

      // 依目前距離由近到遠排序
      const sortedLions = WIND_LIONS.map(lion => ({
        ...lion,
        distance: getDistanceMeters(userPos.lat, userPos.lng, lion.lat, lion.lng),
        isCollected: collectedIds.includes(lion.id)
      })).sort((a, b) => a.distance - b.distance);

      // 根據鄉鎮、收集狀態與關鍵字過濾
      const filtered = sortedLions.filter(lion => {
        if (currentTownship !== 'all' && lion.township !== currentTownship) return false;
        if (currentFilter === 'collected' && !lion.isCollected) return false;
        if (currentFilter === 'uncollected' && lion.isCollected) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchName = lion.name.toLowerCase().includes(q);
          const matchTown = lion.township.toLowerCase().includes(q);
          const matchFeat = lion.feature.toLowerCase().includes(q);
          if (!matchName && !matchTown && !matchFeat) return false;
        }
        return true;
      });

      document.getElementById('filtered-count-badge').textContent = `${filtered.length} 尊`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-stone-400">
            <div class="text-4xl mb-2">🦁</div>
            <p class="font-bold text-sm">找不到符合條件的風獅爺喔！</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(lion => {
        const isNearby = lion.distance <= alertRadius;
        return `
          <div class="sketch-box-sm p-3 relative transition-all ${lion.isCollected ? 'bg-[#FFFDF5]' : 'bg-[#F8F5EE]'}" id="card-${lion.id}">
            
            ${lion.isCollected ? `
              <div class="absolute top-2.5 right-2.5 z-10 pointer-events-none">
                <div class="stamp-badge text-[11px]">💮 已參拜收集</div>
              </div>
            ` : ''}

            <div class="flex items-start gap-3">
              <div onclick="focusLionOnMap('${lion.id}')" class="w-14 h-14 rounded-2xl border-2 border-[#3D312A] flex-shrink-0 flex items-center justify-center cursor-pointer ${lion.isCollected ? 'bg-[#FFF3D6]' : 'bg-stone-200'}" title="點擊在地圖上查看">
                ${generateLionSVG(lion, lion.isCollected, 48)}
              </div>

              <div class="flex-1 min-w-0">
                <div class="flex flex-wrap items-center gap-1.5 mb-0.5">
                  <span class="text-[10px] font-black px-1.5 py-0.5 rounded bg-stone-800 text-white">
                    #${lion.indexNum}
                  </span>
                  <span class="text-[10px] font-black px-1.5 py-0.5 rounded bg-[#FFE082] border border-[#3D312A]">
                    ${lion.township}
                  </span>
                  <span class="text-xs font-bold ${isNearby ? 'text-[#E05A47] animate-pulse' : 'text-stone-500'}">
                    📍 ${formatDistance(lion.distance)} ${isNearby ? '(感應圈內!)' : ''}
                  </span>
                </div>

                <h3 onclick="focusLionOnMap('${lion.id}')" class="text-sm font-black text-[#3D312A] cursor-pointer hover:underline truncate">
                  ${lion.name}
                </h3>
                <p class="text-[11px] text-stone-500 font-bold">
                  📏 ${lion.height} ｜ 持有物：${lion.accessory}
                </p>
                <p class="text-xs text-stone-600 mt-0.5 leading-relaxed">
                  ${lion.feature}
                </p>
              </div>
            </div>

            <div class="mt-2.5 pt-2 border-t border-dashed border-stone-300 flex flex-wrap items-center justify-between gap-1.5">
              <div class="flex items-center gap-1.5">
                <a href="https://www.google.com/maps/dir/?api=1&destination=${lion.lat},${lion.lng}&travelmode=driving" target="_blank"
                   class="sketch-btn bg-[#68A678] hover:bg-[#579266] text-white px-2.5 py-1 text-xs font-black flex items-center gap-1">
                  🧭 導航
                </a>

                <button onclick="simulateWalkTo('${lion.id}')" class="sketch-btn bg-[#FFF4CC] hover:bg-[#FFE699] text-[#3D312A] px-2 py-1 text-xs font-bold">
                  ✨ 模擬走到附近
                </button>
              </div>

              <button onclick="toggleCollect('${lion.id}')" class="sketch-btn px-2.5 py-1 text-xs font-black ${lion.isCollected ? 'bg-stone-200 text-stone-700' : 'bg-[#E05A47] text-white'}">
                ${lion.isCollected ? '✓ 已收集' : '💮 蓋章收集'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // =========================================================
    // 8. 互動邏輯：收集、篩選、搜尋
    // =========================================================
    function toggleCollect(lionId) {
      const idx = collectedIds.indexOf(lionId);
      if (idx === -1) {
        collectedIds.push(lionId);
        playSound('stamp');
      } else {
        collectedIds.splice(idx, 1);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(collectedIds));
      updateUI();
    }

    function updateProgressUI() {
      const count = collectedIds.length;
      const total = WIND_LIONS.length;
      const pct = Math.round((count / total) * 100);

      document.getElementById('collected-count').textContent = count;
      document.getElementById('total-count').textContent = total;
      document.getElementById('progress-bar').style.width = `${pct}%`;

      document.getElementById('filter-all').textContent = `全部 (${total})`;
      document.getElementById('filter-uncollected').textContent = `未尋獲 (${total - count})`;
      document.getElementById('filter-collected').textContent = `已收集 (${count})`;
    }

    function setFilter(filterType) {
      currentFilter = filterType;
      ['all', 'uncollected', 'collected'].forEach(type => {
        const btn = document.getElementById(`filter-${type}`);
        if (type === filterType) {
          btn.className = 'sketch-btn flex-1 py-1 text-xs font-black bg-[#E05A47] text-white';
        } else {
          btn.className = 'sketch-btn flex-1 py-1 text-xs font-bold bg-[#FDF8EC]';
        }
      });
      renderLionList();
    }

    function setTownship(township) {
      currentTownship = township;
      updateUI();
    }

    function handleSearch(val) {
      searchQuery = val.trim();
      renderLionList();
    }

    function resetProgress() {
      if (confirm('確定要清空手札上的所有風獅爺收集印章嗎？')) {
        collectedIds = [];
        notifiedSet.clear();
        localStorage.removeItem(STORAGE_KEY);
        updateUI();
      }
    }

    function updateUI() {
      updateProgressUI();
      renderLionList();
      renderMapMarkers();
    }

    // =========================================================
    // 9. GPS 定位追蹤與自訂距離感應通知
    // =========================================================
    function toggleGPS() {
      const btnText = document.getElementById('gps-text');
      const dot = document.getElementById('gps-dot');
      const statusText = document.getElementById('location-status');

      if (isGpsActive) {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        watchId = null;
        isGpsActive = false;
        btnText.textContent = '開啟 GPS 雷達';
        dot.className = 'w-2.5 h-2.5 rounded-full bg-stone-500 border border-[#3D312A]';
        statusText.textContent = '📍 GPS 已暫停';
        return;
      }

      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }

      if (!('geolocation' in navigator)) {
        alert('你的瀏覽器不支援 GPS 定位，請使用卡片上的「✨ 模擬走到附近」按鈕體驗！');
        return;
      }

      isGpsActive = true;
      btnText.textContent = 'GPS 雷達偵測中';
      dot.className = 'w-2.5 h-2.5 rounded-full bg-green-500 animate-ping border border-[#3D312A]';
      statusText.textContent = '📡 正在取得衛星定位...';

      watchId = navigator.geolocation.watchPosition(
        pos => {
          userPos = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          };
          statusText.textContent = `📍 即時定位 (${userPos.lat.toFixed(4)}, ${userPos.lng.toFixed(4)})`;
          updateUserMapMarker();
          checkProximityAndNotify();
          updateUI();
        },
        err => {
          statusText.textContent = '⚠️ 無法取得精準定位，可使用「模擬走到附近」測試';
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
      );
    }

    function simulateWalkTo(lionId) {
      const lion = WIND_LIONS.find(l => l.id === lionId);
      if (!lion) return;

      // 移動到該風獅爺旁約 15 公尺處（確保即使使用者設定最小 20m 也能觸發通知）
      userPos = {
        lat: lion.lat - 0.00012,
        lng: lion.lng - 0.00008
      };

      document.getElementById('location-status').textContent = `✨ 模擬位置：已抵達【${lion.name}】旁！`;
      updateUserMapMarker();
      map.flyTo([lion.lat, lion.lng], 16, { duration: 0.7 });

      notifiedSet.delete(lion.id);
      checkProximityAndNotify();
      updateUI();
    }

    function checkProximityAndNotify() {
      // 找出距離最近且在使用者設定感應半徑內的未收集風獅爺
      let closestTarget = null;
      let minDist = Infinity;

      for (const lion of WIND_LIONS) {
        const dist = getDistanceMeters(userPos.lat, userPos.lng, lion.lat, lion.lng);
        const isCollected = collectedIds.includes(lion.id);

        if (dist <= alertRadius && !isCollected && !notifiedSet.has(lion.id)) {
          if (dist < minDist) {
            minDist = dist;
            closestTarget = lion;
          }
        }
      }

      if (closestTarget) {
        notifiedSet.add(closestTarget.id);
        triggerProximityAlert(closestTarget, minDist);
      }
    }

    function triggerProximityAlert(lion, dist) {
      currentAlertLionId = lion.id;
      playSound('radar');

      const alertBox = document.getElementById('proximity-alert');
      document.getElementById('alert-title').textContent = `${lion.name} 就在附近！`;
      document.getElementById('alert-desc').textContent = `目前距離約 ${dist} 公尺（低於你設定的 ${formatDistance(alertRadius)}），快去蓋章收集吧！`;
      alertBox.classList.remove('hidden');

      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(`🦁 發現風獅爺：${lion.name}！`, {
          body: `距離僅 ${dist} 公尺（${lion.township}）！${lion.feature}`
        });
      }
    }

    function collectFromAlert() {
      if (currentAlertLionId && !collectedIds.includes(currentAlertLionId)) {
        toggleCollect(currentAlertLionId);
      }
      closeAlert();
    }

    function closeAlert() {
      document.getElementById('proximity-alert').classList.add('hidden');
      currentAlertLionId = null;
    }

    // =========================================================
    // 10. 啟動初始化
    // =========================================================
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('header-lion-icon').innerHTML = generateLionSVG(WIND_LIONS[62], true, 56);
      initMap();
      updateAlertRadius(alertRadius);
      updateUI();
    });
  </script>
</body>
</html>
